<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rancangan Dashboard Admin LKH KKN</title>
<meta name="description" content="Rancangan antarmuka dashboard admin LKH KKN. Seluruh angka, nama, dan berkas pada halaman ini adalah data contoh.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --hijau:#0B753A; --hijau-tua:#0F3D26; --hijau-teks:#0B5A2D;
  --dasar:#F4F6F3; --kartu:#FFFFFF; --garis:#DDE3DF; --garis-tegas:#B8C2BC;
  --teks:#17211B; --teks-2:#33413A; --teks-3:#4A554F; --sela:#EEF2EF; --alas:#E6ECE8;
  --biru-bg:#E3ECFB; --biru:#1E3A8A; --jingga-bg:#FCE6D2; --jingga:#5F2108; --jingga-tua:#8A2F0B;
  --ok-bg:#DDEFE3; --netral-bg:#E8ECE9;
  --judul:'Space Grotesk',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--dasar);color:var(--teks);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
button,select,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
a{color:var(--hijau-teks)}a:hover{color:#063D1E}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{min-height:100vh;display:flex;flex-direction:column}
.puncak{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px;padding:12px max(32px,calc((100% - 1320px)/2 + 32px));background:var(--kartu);border-bottom:1px solid var(--garis)}
.merek{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.merek b{font-family:var(--judul);font-size:20px;letter-spacing:.2px;color:var(--hijau-tua)}
.merek span{font-size:12px;color:var(--teks-3)}
.tautan-puncak{display:flex;flex-wrap:wrap;gap:0 18px;font-size:13px;font-weight:600}
.tautan-puncak a{display:inline-flex;align-items:center;min-height:44px}
.catatan{flex:1 1 100%;font-size:12px;color:var(--teks-3)}
.dok{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--hijau-tua);box-shadow:0 10px 28px rgba(15,61,38,.32);max-width:calc(100% - 16px)}
.dok button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.dok button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dok button:hover{background:rgba(255,255,255,.14)}
.dok button[aria-current="page"]{background:#fff;color:var(--hijau-tua)}
.dok button:focus-visible{outline-color:#fff;outline-offset:1px}
main{flex:1 1 auto;min-width:0;width:100%;max-width:1320px;margin:0 auto;padding:28px 32px 120px;display:flex;flex-direction:column;gap:24px}
main:focus{outline:none}

.kepala{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.kepala h1{font-family:var(--judul);font-size:28px}
.kepala p{color:var(--teks-3);margin-top:4px}
.isian{display:flex;flex-direction:column;gap:4px}
.isian label{font-size:12px;font-weight:600;color:var(--teks-3)}
select{min-height:44px;padding:8px 12px;border:1px solid var(--garis-tegas);border-radius:8px;background:#fff;color:var(--teks);font-weight:600}

.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.kartu h2{font-size:16px}
.kartu .sub{font-size:12px;color:var(--teks-3);margin-top:2px}
.angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.angka .kartu{gap:6px;padding:18px 20px}
.angka .label{font-size:12px;font-weight:600;color:var(--teks-3)}
.angka .nilai{font-family:var(--judul);font-size:32px;font-weight:700;line-height:1.1}
.angka .ket{font-size:12px;color:var(--teks-3)}
.dua{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.dua > .lebar{flex:3 1 420px}
.dua > .sempit{flex:2 1 340px}
.atas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.segmen{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--alas)}
.segmen button{min-height:36px;padding:6px 14px;border:0;border-radius:7px;font-weight:600;font-size:13px;background:transparent;color:var(--teks-2)}
.segmen button[aria-pressed="true"]{background:#fff;color:var(--teks)}
.pil{display:flex;flex-wrap:wrap;gap:8px}
.pil button{min-height:44px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--garis-tegas);background:#fff;color:var(--teks)}
.pil button[aria-pressed="true"]{background:var(--hijau-tua);border-color:var(--hijau-tua);color:#fff}

.minggu{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.minggu > div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.minggu .nilai{font-size:13px;font-weight:700}
.minggu .tiang{width:100%;max-width:64px;height:180px;display:flex;align-items:flex-end;border-radius:6px;background:var(--sela)}
.minggu .tiang i{display:block;width:100%;border-radius:6px;background:var(--hijau)}
.minggu .nama{font-size:12px;font-weight:600;text-align:center}
.minggu .ket{font-size:11px;color:var(--teks-3);text-align:center}
.minggu .pendek{display:none}
.garis{display:flex;gap:10px}
.garis .sumbu-y{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:var(--teks-3);text-align:right}
.garis .badan{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.garis svg{display:block;width:100%;height:220px;overflow:visible}
.garis .sumbu-x{display:flex;font-size:11px;color:var(--teks-3)}
.garis .sumbu-x span{min-width:0;text-align:center}
.kecil{font-size:11px;color:var(--teks-3)}

.batang{display:flex;flex-direction:column;gap:12px}
.batang > div{display:grid;grid-template-columns:minmax(84px,120px) minmax(0,1fr) 92px;gap:10px;align-items:center}
.batang .nama{font-size:13px;font-weight:500}
.batang .jalur{height:14px;border-radius:7px;background:var(--alas);overflow:hidden}
.batang .jalur i{display:block;height:14px;border-radius:7px;background:var(--hijau)}
.batang .teks{font-size:12px;color:var(--teks-2);text-align:right}

.gulir{overflow-x:auto}
.tabel{display:flex;flex-direction:column}
.tabel [role="row"]{display:grid;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--alas);font-size:13px}
.tabel [role="row"].judul{padding:10px 12px;background:var(--sela);border:0;border-radius:8px;font-size:12px;font-weight:700;color:var(--teks-2)}
.tabel .tebal{font-weight:600}
.tabel .angka-rata{font-variant-numeric:tabular-nums}
.t-tindak{min-width:620px}
.t-tindak [role="row"]{grid-template-columns:140px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
.t-pratinjau{min-width:860px}
.t-pratinjau [role="row"]{grid-template-columns:56px 1fr 1.3fr 1fr 1fr 116px 1.6fr}
.t-riwayat{min-width:900px}
.t-riwayat [role="row"]{grid-template-columns:1.1fr .9fr 1.6fr 1.5fr 1fr 110px 190px}
.lencana{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.l-baru{background:var(--biru-bg);color:var(--biru)}
.l-ubah,.l-batal{background:var(--netral-bg);color:var(--teks-2)}
.l-salah{background:var(--jingga-bg);color:var(--jingga)}
.l-ok{background:var(--ok-bg);color:var(--hijau-teks)}

.langkah{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px}
.langkah li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teks-3)}
.langkah b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--alas);color:var(--teks)}
.langkah li.lewat b{background:#CFE3D6}
.langkah li[aria-current="step"]{color:var(--teks)}
.langkah li[aria-current="step"] b{background:var(--hijau-tua);color:#fff}
.jenis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.jenis button{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-height:88px;padding:14px 16px;border-radius:10px;border:2px solid var(--garis);background:#fff;color:var(--teks)}
.jenis button[aria-pressed="true"]{border-color:var(--hijau-tua);background:#EAF3ED}
.jenis b{font-size:15px}
.jenis span{font-size:12px;color:var(--teks-2)}
.info{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:10px;background:var(--sela)}
.info b{font-size:12px;color:var(--teks-2)}
.info small{font-size:12px;color:var(--teks-2)}
.baris{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tombol{display:inline-flex;align-items:center;text-decoration:none;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--garis-tegas);background:#fff;color:var(--teks);font-weight:600}
.tombol.utama{border:0;padding:10px 20px;background:var(--hijau);color:#fff;font-weight:700}
.tombol.bahaya{border:0;background:var(--jingga-tua);color:#fff;font-weight:700}
.tombol.rapat{padding:8px 12px;font-size:13px}
.unggah{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:20px;border:2px dashed var(--garis-tegas);border-radius:10px;background:#FAFBFA}
.unggah input:focus-visible + label{outline:3px solid #1D4ED8;outline-offset:2px}
.status{font-size:13px;font-weight:600;color:var(--hijau-teks)}
.peringatan{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--jingga-bg);color:var(--jingga)}
.peringatan input{width:20px;height:20px;margin:2px 0 0;flex:none}
.peringatan label{font-size:13px;font-weight:600}
.sempit-maks{max-width:720px}
.tiga{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tiga > div{padding:14px 16px;border-radius:10px;display:flex;flex-direction:column;gap:2px}
.tiga b{font-family:var(--judul);font-size:26px}
.tiga span{font-size:12px;font-weight:600}
.aksi{display:flex;flex-wrap:wrap;gap:8px}
.aturan{display:flex;flex-direction:column;gap:10px}
.aturan label{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.aturan input{width:20px;height:20px;margin:1px 0 0;flex:none}
.posko{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.posko .kartu{gap:10px;padding:16px}
.posko h3{font-size:15px}
.posko ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.posko li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px}
.posko li small{display:block;font-size:12px;color:var(--teks-3)}
.posko li b{font-size:12px;color:var(--teks-2)}
.posko li.ganda small{color:var(--jingga-tua);font-weight:600}
.angka-isian{display:flex;flex-wrap:wrap;gap:12px}
.angka-isian .isian{flex:1 1 150px}
.angka-isian input{min-height:44px;width:100%;padding:8px 12px;border:1px solid var(--garis-tegas);border-radius:8px;background:#fff;font-weight:600}
.t-kab{min-width:660px}
.t-kab [role="row"]{grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 130px 70px 96px;padding:8px 12px}
.t-kab input,.t-kab select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--garis-tegas);border-radius:8px;background:#fff;font-weight:500}
.daftar{border-top:1px solid var(--alas);padding-top:6px}
.daftar summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:13px;cursor:pointer}
.daftar ul{max-height:320px;overflow-y:auto;padding-right:6px}
.rujukan{border:1px solid var(--garis);border-radius:10px;padding:0 14px}
.rujukan summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.rujukan .gulir{margin-bottom:12px}
.rujukan p{margin-bottom:12px}
.t-rujukan{min-width:640px}
.t-rujukan [role="row"]{grid-template-columns:110px minmax(0,1.6fr) 90px minmax(0,1.5fr);padding:9px 12px}

@media (max-width:640px){
  .dok button{padding:0 11px}
  .dok button span{display:none}
  .dok button[aria-current="page"] span{display:inline}
}
@media (max-width:560px){
  .puncak{padding:10px 16px}
  main{padding:20px 16px 112px}
  .kepala h1{font-size:24px}
  .minggu{gap:4px}
  .minggu .panjang,.minggu .ket{display:none}
  .minggu .pendek{display:inline}
  .minggu .nilai{font-size:11px}
  .batang > div{grid-template-columns:minmax(72px,96px) minmax(0,1fr) 76px}
}
</style>
</head>

  function persen(a, b) { return Math.round((a / b) * 100) + '%'; }
  function tombolPilih(aksi, label, aktif) {
    return '<button type="button" data-a="' + aksi + '" aria-pressed="' + (aktif ? 'true' : 'false') + '">' + esc(label) + '</button>';
  }
  function barisImpor() {
    if (S.berkasData) return S.berkasData;
    return IMPOR[S.jenis].baris.map(function (r, i) {
      return { baris: i + 2, c: [r[0] || '(kosong)', r[1], r[2] || '(kosong)', r[3] || '(kosong)'], jenis: r[4], ket: r[5] || 'Siap ditambahkan' };
    });
  }
  function hitungImpor(semua) {
    var h = { total: semua.length, baru: 0, ubah: 0, salah: 0 };
    semua.forEach(function (r) { h[r.jenis] += 1; });
    return h;
  }

  // ---------------------------------------------------------------- Ringkasan
  function grafikMinggu(D) {
    var html = '';
    for (var k = 0; k < Math.ceil(LAMA / 7); k++) {
      var awal = k * 7 + 1;
      var akhir = Math.min(LAMA, awal + 6);
      var isi = D.harian.slice(awal - 1, akhir);
      var penuh = isi.length === akhir - awal + 1;
      var rata = isi.length ? Math.round(isi.reduce(function (t, v) { return t + v; }, 0) / isi.length) : null;
      var ket = rata === null ? 'Belum berjalan' : 'Hari ' + awal + '–' + akhir + (penuh ? '' : ', berjalan');
      html += '<div><span class="nilai">' + (rata === null ? '–' : rata + '%') + '</span>' +
        '<div class="tiang" aria-hidden="true"><i style="height:' + (rata === null ? 0 : Math.round(rata * 1.8)) + 'px;opacity:' + (penuh ? 1 : 0.55) + '"></i></div>' +
        '<span class="nama"><span class="panjang">Minggu ' + (k + 1) + '</span><span class="pendek">M' + (k + 1) + '</span></span>' +
        '<span class="ket">' + ket + '</span></div>';
    }
    return '<div class="minggu">' + html + '</div>';
  }
  function grafikHari(D) {
    var n = D.harian.length;
    var x = function (d) { return (((d - 0.5) / LAMA) * 100).toFixed(2); };
    var titik = D.harian.map(function (v, i) { return x(i + 1) + ',' + (100 - ((v - 50) / 50) * 100).toFixed(2); });
    var gaya = 'vector-effect:non-scaling-stroke;stroke-width:1;';
    var garis = '<line x1="0" y1="0" x2="100" y2="0" style="' + gaya + 'stroke:#DDE3DF"/>' +
      '<line x1="0" y1="50" x2="100" y2="50" style="' + gaya + 'stroke:#DDE3DF"/>' +
      '<line x1="0" y1="100" x2="100" y2="100" style="' + gaya + 'stroke:#B8C2BC"/>';
    var sumbu = '';
    for (var k = 0; k < Math.ceil(LAMA / 7); k++) {
      var lebar = Math.min(7, LAMA - k * 7);
      if (k > 0) {
        var gx = ((k * 7 / LAMA) * 100).toFixed(2);
        garis += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="100" style="' + gaya + 'stroke:#E6ECE8"/>';
      }
      sumbu += '<span style="flex:' + lebar + ' 1 0">M' + (k + 1) + '</span>';
    }
    var label = 'Grafik garis kehadiran harian sampai hari ke-' + n + ' dari ' + LAMA + ' hari, dari ' + D.harian[0] + ' persen menjadi ' + D.harian[n - 1] + ' persen.';
    return '<div class="garis"><div class="sumbu-y" aria-hidden="true"><span>100%</span><span>75%</span><span>50%</span></div>' +
      '<div class="badan"><svg role="img" aria-label="' + label + '" viewBox="0 0 100 100" preserveAspectRatio="none">' + garis +
      '<path d="M' + x(1) + ',100 L' + titik.join(' L') + ' L' + x(n) + ',100 Z" style="fill:#0B753A;opacity:.12"/>' +
      '<polyline points="' + titik.join(' ') + '" style="fill:none;stroke:#0B753A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"/>' +
      '</svg><div class="sumbu-x" aria-hidden="true">' + sumbu + '</div>' +
      '<span class="kecil">M = minggu. Garis berhenti pada hari yang sedang berjalan.</span></div></div>';
  }
  function ringkasan() {
    var D = DATA[S.angkatan];
    var peserta = D.kecamatan.reduce(function (t, r) { return t + r[1]; }, 0);
    var hadir = D.kecamatan.reduce(function (t, r) { return t + r[2]; }, 0);
    var n = D.harian.length;
    var kartu = [
      ['Peserta aktif', peserta, D.kecamatan.length + ' kecamatan'],
      ['Sudah absen hari ini', persen(hadir, peserta), hadir + ' dari ' + peserta + ' peserta'],
      ['Belum mendaftarkan wajah', D.belumWajah, 'peserta belum dapat absen'],
      ['LKH menunggu pembimbing', D.lkhMenunggu, 'laporan belum diperiksa']
    ].map(function (k) {
      return '<div class="kartu"><span class="label">' + k[0] + '</span><span class="nilai">' + k[1] + '</span><span class="ket">' + k[2] + '</span></div>';
    }).join('');
    var batang = D[S.kelompok].map(function (r) {
      return '<div><span class="nama">' + r[0] + '</span><div class="jalur" aria-hidden="true"><i style="width:' + persen(r[2], r[1]) + '"></i></div><span class="teks">' + r[2] + ' dari ' + r[1] + '</span></div>';
    }).join('');
    var kepala = {
      absen: ['NIM', 'Nama', 'Kecamatan', 'Tidak absen'],
      reset: ['NIM', 'Nama', 'Pengajuan', 'Kuota reset'],
      lkh: ['Kecamatan', 'Pembimbing', 'Belum diperiksa', 'Menunggu']
    }[S.tindak];
    var tindak = [['absen', 'Tidak absen 3 hari atau lebih'], ['reset', 'Permintaan reset wajah'], ['lkh', 'LKH belum diperiksa']].map(function (t) {
      return tombolPilih('tindak:' + t[0], t[1] + ' · ' + D[t[0]].length, S.tindak === t[0]);
    }).join('');
    var baris = D[S.tindak].map(function (r) {
      return '<div role="row"><span role="cell" class="angka-rata">' + r[0] + '</span><span role="cell" class="tebal">' + r[1] + '</span><span role="cell">' + r[2] + '</span><span role="cell">' + r[3] + '</span></div>';
    }).join('');

    return '<header class="kepala"><div><h1>Ringkasan</h1><p>Keadaan absensi dan laporan kerja harian per angkatan.</p></div>' +
      '<div class="isian"><label for="angkatan">Angkatan</label><select id="angkatan">' +
      '<option value="A"' + (S.angkatan === 'A' ? ' selected' : '') + '>Angkatan A (contoh)</option>' +
      '<option value="B"' + (S.angkatan === 'B' ? ' selected' : '') + '>Angkatan B (contoh)</option></select></div></header>' +
      '<section class="angka" aria-label="Angka ringkas">' + kartu + '</section>' +
      '<section class="dua"><div class="kartu lebar"><div class="atas"><div><h2>Kehadiran selama KKN</h2>' +
      '<p class="sub">Persentase peserta yang absen. Hari ke-' + n + ' dari ' + LAMA + ' hari KKN; hari ini ' + D.harian[n - 1] + '%.</p></div>' +
      '<div class="segmen" role="group" aria-label="Tampilan grafik">' + tombolPilih('rentang:minggu', 'Per minggu', S.rentang === 'minggu') + tombolPilih('rentang:hari', 'Per hari', S.rentang === 'hari') + '</div></div>' +
      (S.rentang === 'minggu' ? grafikMinggu(D) : grafikHari(D)) + '</div>' +
      '<div class="kartu sempit"><div class="atas"><div><h2>Kehadiran hari ini</h2><p class="sub">Jumlah yang sudah absen dari jumlah peserta.</p></div>' +
      '<div class="segmen" role="group" aria-label="Kelompokkan menurut">' + tombolPilih('kelompok:kecamatan', 'Kecamatan', S.kelompok === 'kecamatan') + tombolPilih('kelompok:pembimbing', 'Pembimbing', S.kelompok === 'pembimbing') + '</div></div>' +
      '<div class="batang">' + batang + '</div></div></section>' +
      '<section class="kartu"><div><h2>Perlu ditindaklanjuti</h2><p class="sub">Daftar yang membutuhkan tindakan admin atau pembimbing.</p></div>' +
      '<div class="pil" role="group" aria-label="Jenis tindak lanjut">' + tindak + '</div>' +
      '<div class="gulir"><div class="tabel t-tindak" role="table" aria-label="Daftar tindak lanjut"><div role="row" class="judul">' +
      kepala.map(function (k) { return '<span role="columnheader">' + k + '</span>'; }).join('') + '</div>' + baris + '</div></div></section>';
  }

  // -------------------------------------------------------------------- Impor
  function impor() {
    var J = IMPOR[S.jenis];
    var semua = barisImpor();
    var h = hitungImpor(semua);
    var langkah = ['Pilih dan unggah', 'Periksa', 'Konfirmasi', 'Selesai'].map(function (l, i) {
      var no = i + 1;
      return '<li' + (S.langkah === no ? ' aria-current="step"' : '') + (S.langkah > no ? ' class="lewat"' : '') + '><b>' + no + '</b>' + l + '</li>';
    }).join('');
    var isi = '';

    if (S.langkah === 1) {
      var jenis = ['peserta', 'pembimbing', 'lokasi', 'angkatan'].map(function (id) {
        return '<button type="button" data-a="jenis:' + id + '" aria-pressed="' + (S.jenis === id ? 'true' : 'false') + '"><b>' + IMPOR[id].nama + '</b><span>' + IMPOR[id].uraian + '</span></button>';
      }).join('');
      isi = '<section class="kartu"><h2>1. Pilih jenis data</h2><div class="jenis" role="group" aria-label="Jenis data">' + jenis + '</div>' +
        '<div class="info"><b>Kolom lembar ' + J.nama + '</b><span>' + J.kolom.join(', ') + (J.kolomLain ? ', ' + J.kolomLain : '') + '</span><small>Tujuan: ' + J.tujuan + '</small></div>' +
        '<div class="baris"><a class="tombol" href="Templat-Impor-LKH-KKN.xlsx" download>Unduh templat Excel</a>' +
        '<span class="kecil">Satu berkas memuat lembar Angkatan, Lokasi, Pembimbing, dan Peserta.</span></div></section>' +
        '<section class="kartu"><h2>2. Unggah berkas</h2><div class="unggah"><span class="tebal" style="font-weight:600">Berkas Excel atau CSV (.xlsx, .csv)</span>' +
        '<span class="kecil">Berkas benar-benar dibaca: templat Excel yang sudah diisi (lembar ' + J.nama + ')' + (S.jenis === 'peserta' ? ', atau CSV hasil unduhan formulir pendaftaran' : ', atau CSV dengan judul kolom yang sama') + '. Berkas dibaca di peramban ini dan tidak dikirim ke peladen. Tombol berkas contoh hanya memperlihatkan alurnya.</span>' +
        (S.galatBerkas ? '<div class="peringatan" role="alert"><span>' + esc(S.galatBerkas) + '</span></div>' : '') +
        '<div class="baris"><input class="sr" id="berkas" type="file" accept=".xlsx,.csv"><label class="tombol" for="berkas">Pilih berkas</label>' +
        '<button type="button" class="tombol" data-a="contoh">Pakai berkas contoh</button></div>' +
        (S.berkas ? '<span role="status" class="status">Berkas terpilih: ' + esc(S.berkas) + '</span>' : '') + '</div>' +
        '<div class="baris"><button type="button" class="tombol utama" data-a="langkah:2"' + (S.berkas ? '' : ' disabled') + '>Periksa berkas</button>' +
        (S.berkas ? '' : '<span class="kecil">Pilih berkas lebih dahulu.</span>') + '</div></section>';
    } else if (S.langkah === 2) {
      var saring = [['semua', 'Semua', h.total], ['baru', 'Baru', h.baru], ['ubah', 'Diperbarui', h.ubah], ['salah', 'Bermasalah', h.salah]].map(function (t) {
        return tombolPilih('saring:' + t[0], t[1] + ' · ' + t[2], S.saring === t[0]);
      }).join('');
      var asli = !!S.berkasData;
      var tersaring = semua.filter(function (r) { return S.saring === 'semua' || r.jenis === S.saring; });
      var baris = tersaring.slice(0, 300).map(function (r) {
        return '<div role="row"><span role="cell" class="angka-rata" style="color:var(--teks-3)">' + r.baris + '</span><span role="cell" class="angka-rata">' + esc(r.c[0]) + '</span><span role="cell" class="tebal">' + esc(r.c[1]) + '</span><span role="cell">' + esc(r.c[2]) + '</span><span role="cell">' + esc(r.c[3]) + '</span>' +
          '<span role="cell"><span class="lencana ' + LENCANA[r.jenis][1] + '">' + LENCANA[r.jenis][0] + '</span></span><span role="cell" style="font-size:12px;color:var(--teks-2)">' + esc(r.ket) + '</span></div>';
      }).join('');
      var boleh = h.salah === 0 || S.lewati;
      isi = '<section class="kartu"><div><h2>Hasil pemeriksaan ' + J.nama + '</h2><p class="sub">Berkas ' + esc(S.berkas) + ' · ' + h.total + ' baris terbaca. ' + (asli ? 'Isi berkas dibaca di peramban ini; tidak ada data yang dikirim ke peladen.' : 'Pratinjau ini memakai baris contoh.') +
        (tersaring.length > 300 ? ' Ditampilkan 300 baris pertama dari ' + tersaring.length + '.' : '') + '</p></div>' +
        '<div class="pil" role="group" aria-label="Saring baris">' + saring + '</div>' +
        '<div class="gulir"><div class="tabel t-pratinjau" role="table" aria-label="Pratinjau baris"><div role="row" class="judul"><span role="columnheader">Baris</span>' +
        J.kolom.map(function (k) { return '<span role="columnheader">' + k + '</span>'; }).join('') + '<span role="columnheader">Status</span><span role="columnheader">Keterangan</span></div>' + baris + '</div></div>' +
        (h.salah > 0 ? '<div class="peringatan"><input id="lewati" type="checkbox"' + (S.lewati ? ' checked' : '') + '><label for="lewati">Lewati ' + h.salah + ' baris bermasalah dan impor sisanya. Tanpa pilihan ini, berkas harus diperbaiki dan diunggah ulang.</label></div>' : '') +
        '<div class="baris"><button type="button" class="tombol" data-a="langkah:1">Kembali</button><button type="button" class="tombol utama" data-a="langkah:3"' + (boleh ? '' : ' disabled') + '>Lanjut ke konfirmasi</button></div></section>';
    } else if (S.langkah === 3) {
      isi = '<section class="kartu sempit-maks"><h2>Konfirmasi impor ' + J.nama + '</h2><div class="tiga">' +
        '<div style="background:var(--biru-bg);color:var(--biru)"><b>' + h.baru + '</b><span>baris baru ditambahkan</span></div>' +
        '<div style="background:var(--netral-bg);color:var(--teks-2)"><b>' + h.ubah + '</b><span>baris lama diperbarui</span></div>' +
        '<div style="background:var(--jingga-bg);color:var(--jingga)"><b>' + h.salah + '</b><span>baris dilewati</span></div></div>' +
        '<p style="font-size:13px;color:var(--teks-2)">Seluruh perubahan ditulis dalam satu transaksi: tersimpan semuanya atau tidak sama sekali. Impor ini tercatat di riwayat dan dapat dibatalkan.</p>' +
        '<div class="baris"><button type="button" class="tombol" data-a="langkah:2">Kembali</button><button type="button" class="tombol utama" data-a="impor">Impor sekarang</button></div></section>';
    } else {
      isi = '<section class="kartu sempit-maks" role="status"><h2 style="font-size:18px;color:var(--hijau-teks)">Impor selesai</h2><p>' + esc(S.hasil) + '</p>' +
        (S.jenis === 'peserta' ? '<p class="kecil">Peserta yang belum punya posko dapat ditempatkan lewat menu Penempatan.</p>' : '') +
        (S.jenis === 'peserta' && S.pesertaAktif ? '<div class="baris"><button type="button" class="tombol utama" data-a="layar:penempatan">Tempatkan peserta</button></div>' + kotakSql('unduh-sql-peserta', 'Unduh SQL tanpa penempatan') : '') +
        kotakSqlJenis() +
        '<div class="baris"><button type="button" class="tombol utama" data-a="riwayat-buka">Lihat riwayat impor</button><button type="button" class="tombol" data-a="impor-lagi">Impor berkas lain</button></div></section>';
    }

    return '<header class="kepala"><div><h1>Impor data</h1><p>Data dari Excel diperiksa dan ditampilkan lebih dahulu. Tidak ada yang tersimpan sebelum admin menekan konfirmasi.</p></div></header>' +
      '<ol class="langkah" aria-label="Langkah impor">' + langkah + '</ol>' + isi;
  }

  // --------------------------------------------------------------- Penempatan
  function koma(x) { return (Math.round(x * 10) / 10).toString().replace('.', ','); }
  function penempatan() {
    var H = S.penempatan, peserta = dataPeserta(), perKab = S.satuan === 'kabupaten';
    var susunan = susunSatuan(), satuan = susunan.satuan;
    var kuota = bagiKuota(peserta.length, satuan.map(function (x) { return x.bobot; }));
    var centang = function (id, k, teks) {
      return '<label for="' + id + '"><input id="' + id + '" type="checkbox"' + (S.aturan[k] ? ' checked' : '') + '><span>' + teks + '</span></label>';
    };
    var angka = function (id, label, nilai, min, maks) {
      return '<div class="isian"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="number" inputmode="numeric" min="' + min + '" max="' + maks + '" value="' + nilai + '"></div>';
    };
    var peringatan = '', pengaturan = '';

    if (perKab) {
      var pilihanBahasa = function (v) {
        return [['', 'Bukan Bugis atau Makassar'], ['bugis', 'Bugis'], ['makassar', 'Makassar'], ['keduanya', 'Bugis dan Makassar']].map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('');
      };
      var nomorKuota = 0;
      pengaturan = '<div class="gulir"><div class="tabel t-kab" role="table" aria-label="Daftar kabupaten atau kecamatan"><div role="row" class="judul"><span role="columnheader">Kabupaten atau kecamatan</span><span role="columnheader">Bahasa setempat</span><span role="columnheader">Daya tampung acuan</span><span role="columnheader">Kuota</span><span role="columnheader">Tindakan</span></div>' +
        S.kab.map(function (x, i) {
          var dipakai = x.nama.trim() !== '' && x.bobot > 0;
          var k = dipakai ? kuota[nomorKuota++] : 0;
          return '<div role="row"><span role="cell"><input id="kab-nama-' + i + '" type="text" maxlength="40" aria-label="Nama kabupaten baris ' + (i + 1) + '" value="' + esc(x.nama) + '"></span>' +
            '<span role="cell"><select id="kab-bahasa-' + i + '" aria-label="Bahasa setempat baris ' + (i + 1) + '">' + pilihanBahasa(x.bahasa) + '</select></span>' +
            '<span role="cell"><input id="kab-bobot-' + i + '" type="number" inputmode="numeric" min="1" max="100000" aria-label="Daya tampung acuan baris ' + (i + 1) + '" value="' + x.bobot + '"></span>' +
            '<span role="cell" class="tebal angka-rata">' + (dipakai ? k : '–') + '</span>' +
            '<span role="cell"><button type="button" class="tombol rapat" data-a="kab-hapus:' + i + '" aria-label="Hapus ' + esc(x.nama || 'baris ' + (i + 1)) + '">Hapus</button></span></div>';
        }).join('') + '</div></div>' +
        '<p class="kecil">Kuota dihitung sebanding dengan daya tampung acuan, sehingga jumlah seluruh kuota sama dengan jumlah peserta. Daya tampung bawaan adalah jumlah mahasiswa pada KKN Angkatan 78. Basis data hanya menyimpan penempatan sampai kecamatan, jadi penempatan baru tertulis ke basis data bila daftar ini berisi kecamatan.</p>' +
        '<div class="baris"><button type="button" class="tombol" data-a="kab-tambah">Tambah baris</button><button type="button" class="tombol" data-a="kab-78">Pakai 7 kabupaten Angkatan 78</button><button type="button" class="tombol" data-a="kec-78">Pakai 21 kecamatan Angkatan 78</button></div>' +
        '<div class="angka-isian">' + angka('isiposko', 'Perkiraan peserta per posko', S.isiPosko, 2, 100) + '</div>';
      if (!satuan.length) peringatan += '<div class="peringatan"><span>Belum ada wilayah. Tambahkan sekurangnya satu.</span></div>';
      if (S.aturan.bahasa) {
        [['bugis', 'Bugis'], ['makassar', 'Makassar'], ['keduanya', 'Bugis atau Makassar']].forEach(function (b) {
          var butuh = 0;
          satuan.forEach(function (x, i) { if (x.bahasa === b[0]) butuh += Math.min(kuota[i], susunan.opsi.butuh(kuota[i])); });
          if (!butuh) return;
          var aktif = peserta.filter(function (m) { return tingkatBahasa(m, b[0]) === 2; }).length;
          var pasif = peserta.filter(function (m) { return tingkatBahasa(m, b[0]) === 1; }).length;
          if (aktif + pasif < butuh) peringatan += '<div class="peringatan"><span>Penutur bahasa ' + b[1] + ' tidak cukup: dibutuhkan ' + butuh + ' orang, sedangkan yang ada ' + aktif + ' aktif dan ' + pasif + ' pasif.</span></div>';
          else if (aktif < butuh) peringatan += '<p class="kecil">Wilayah berbahasa ' + b[1] + ' membutuhkan ' + butuh + ' penutur; yang aktif hanya ' + aktif + ', kekurangannya diisi penutur pasif.</p>';
        });
      }
    } else {
      var lebih = prodiBerlebih(peserta, S.nPosko);
      var batas = lebih.reduce(function (t, p) { return t + p[1] - S.nPosko; }, 0);
      pengaturan = '<div class="angka-isian">' + angka('nposko', 'Jumlah posko', S.nPosko, 1, 500) + angka('nbugis', 'Posko di wilayah Bugis', S.nBugis, 0, S.nPosko) + angka('nmakassar', 'Posko di wilayah Makassar', S.nMakassar, 0, S.nPosko) + '</div>';
      if (S.aturan.bahasa) {
        [['bugis', S.nBugis], ['makassar', S.nMakassar]].forEach(function (b) {
          if (!b[1]) return;
          var butuh = b[1] * MIN_PENUTUR;
          var aktif = peserta.filter(function (m) { return m[b[0]] === 2; }).length;
          var pasif = peserta.filter(function (m) { return m[b[0]] === 1; }).length;
          if (aktif + pasif < butuh) peringatan += '<div class="peringatan"><span>Penutur bahasa ' + NAMA_BAHASA[b[0]] + ' tidak cukup: dibutuhkan ' + butuh + ' orang untuk ' + b[1] + ' posko, sedangkan yang ada ' + aktif + ' aktif dan ' + pasif + ' pasif. Sebagian posko akan kekurangan penutur.</span></div>';
          else if (aktif < butuh) peringatan += '<p class="kecil">Penutur aktif bahasa ' + NAMA_BAHASA[b[0]] + ' hanya ' + aktif + ' dari ' + butuh + ' yang dibutuhkan; kekurangannya diisi penutur pasif.</p>';
        });
      }
      if (S.aturan.prodi && lebih.length) {
        peringatan += '<div class="peringatan"><span>Dengan ' + S.nPosko + ' posko, aturan prodi tidak dapat dipenuhi sepenuhnya: ' +
          lebih.map(function (p) { return esc(p[0]) + ' memiliki ' + p[1] + ' peserta'; }).join(', ') +
          '. Paling sedikit ' + batas + ' peserta akan seposko dengan rekan seprodinya.</span></div>';
      }
    }

    var aturan = perKab
      ? centang('a-bahasa', 'bahasa', 'Wilayah berbahasa Bugis atau Makassar mendapat ' + MIN_PENUTUR + ' penutur untuk tiap perkiraan posko. Penutur aktif diutamakan, penutur pasif menjadi cadangan.') +
        centang('a-prodi', 'prodi', 'Tiap prodi disebar ke semua wilayah sebanding dengan kuotanya.') +
        centang('a-jk', 'jk', 'Laki-laki dan perempuan dibagi sebanding ke semua wilayah.') +
        centang('a-fak', 'fak', 'Tiap fakultas disebar ke semua wilayah sebanding dengan kuotanya.')
      : centang('a-bahasa', 'bahasa', 'Posko di wilayah berbahasa Bugis atau Makassar mendapat sekurangnya ' + MIN_PENUTUR + ' peserta yang menguasai bahasanya. Penutur aktif diutamakan, penutur pasif menjadi cadangan.') +
        centang('a-prodi', 'prodi', 'Tidak ada dua peserta dari prodi yang sama dalam satu posko.') +
        centang('a-jk', 'jk', 'Laki-laki dan perempuan dibagi merata ke semua posko.') +
        centang('a-fak', 'fak', 'Peserta dari fakultas yang sama disebar ke posko yang berbeda sejauh mungkin.');

    var html = '<header class="kepala"><div><h1>Penempatan</h1><p>Peserta ditempatkan secara acak menurut aturan di bawah. Tahap pertama per kabupaten, lalu per kecamatan; pembagian ke posko menyusul. Hasilnya diperiksa admin sebelum disimpan.</p></div></header>' +
      '<section class="kartu"><div class="atas"><div><h2>Aturan penempatan</h2><p class="sub">Sumber data: ' +
      (S.pesertaAktif ? 'berkas ' + esc(S.sumberPeserta) + ', ' + peserta.length + ' peserta' : peserta.length + ' peserta contoh') +
      ' dari ' + jumlahProdi(peserta) + ' prodi.' + (S.pesertaAktif ? '' : ' Untuk memakai data pendaftar, muat berkasnya lewat menu Impor data.') + '</p></div>' +
      '<div class="segmen" role="group" aria-label="Satuan penempatan">' + tombolPilih('satuan:kabupaten', 'Per kabupaten atau kecamatan', perKab) + tombolPilih('satuan:posko', 'Per posko', !perKab) + '</div></div>' +
      pengaturan + '<div class="aturan">' + aturan + '</div>' +
      '<details class="rujukan"><summary>Rujukan wilayah bahasa: lokasi KKN Angkatan 78</summary>' +
      '<div class="gulir"><div class="tabel t-rujukan" role="table" aria-label="Wilayah bahasa lokasi KKN Angkatan 78"><div role="row" class="judul"><span role="columnheader">Kabupaten</span><span role="columnheader">Kecamatan</span><span role="columnheader">Mahasiswa</span><span role="columnheader">Bahasa setempat</span></div>' +
      WILAYAH_78.map(function (w) { return '<div role="row"><span role="cell" class="tebal">' + w[0] + '</span><span role="cell">' + esc(w[1]) + '</span><span role="cell" class="angka-rata">' + w[2] + '</span><span role="cell">' + w[3] + '</span></div>'; }).join('') +
      '</div></div><p class="kecil">Lokasi dan jumlah mahasiswa: Pengumuman Lokasi Mahasiswa KKN Angkatan 78 Tahun 2026, LP2M UIN Alauddin Makassar, 2 Maret 2026 (1.544 mahasiswa, 21 kecamatan). Bahasa setempat: artikel Bahasa Bugis dan Bahasa Makassar di Wikipedia bahasa Indonesia; keterangannya per kabupaten, belum per kecamatan atau desa, sehingga perlu dipastikan ke pemerintah setempat atau dosen pembimbing lapangan.</p></details>' +
      peringatan +
      '<div class="baris"><button type="button" class="tombol utama" data-a="acak"' + (satuan.length ? '' : ' disabled') + '>' + (H ? 'Acak ulang' : 'Acak penempatan') + '</button>' +
      (H ? '<button type="button" class="tombol" data-a="simpan-penempatan"' + (S.penempatanTersimpan ? ' disabled' : '') + '>Simpan penempatan</button>' +
        '<button type="button" class="tombol" data-a="unduh-penempatan">Unduh hasil (CSV)</button>' : '') + '</div>' +
      (H ? kotakSql('unduh-sql', 'Unduh SQL') : '') +
      (S.penempatanTersimpan ? '<span role="status" class="status">Penempatan tersimpan. Pada sistem sebenarnya, hasil ini ditulis ke basis data dan tercatat di riwayat.</span>' : '') +
      '</section>';
    if (!H) return html;

    var kotakBahasa = H.berbahasa
      ? '<div style="background:' + (H.terpenuhi < H.berbahasa ? 'var(--jingga-bg);color:var(--jingga)' : 'var(--ok-bg);color:var(--hijau-teks)') + '"><b>' + H.terpenuhi + ' dari ' + H.berbahasa + '</b><span>' +
        (perKab ? 'wilayah berbahasa daerah terpenuhi kebutuhan penuturnya' : 'posko berbahasa daerah punya ' + MIN_PENUTUR + ' penutur atau lebih') + '</span></div>'
      : '';
    var kotakProdi = perKab
      ? '<div style="background:var(--netral-bg);color:var(--teks-2)"><b>' + koma(H.simpang) + '</b><span>orang, selisih terbesar sebaran prodi dari jatah sebanding' + (H.simpangProdi ? ' (' + esc(H.simpangProdi) + ')' : '') + '</span></div>' +
        '<div style="background:var(--netral-bg);color:var(--teks-2)"><b>' + koma(H.simpangL) + '</b><span>orang, selisih terbesar jumlah laki-laki dari jatah sebanding</span></div>'
      : '<div style="background:' + (H.ganda ? 'var(--jingga-bg);color:var(--jingga)' : 'var(--ok-bg);color:var(--hijau-teks)') + '"><b>' + H.ganda + '</b><span>peserta seposko dengan rekan seprodi</span></div>' +
        '<div style="background:var(--netral-bg);color:var(--teks-2)"><b>' + (H.jumlahMin === H.jumlahMaks ? H.jumlahMin : H.jumlahMin + '–' + H.jumlahMaks) + '</b><span>peserta per posko</span></div>' +
        '<div style="background:var(--netral-bg);color:var(--teks-2)"><b>' + (H.lkMin === H.lkMaks ? H.lkMin : H.lkMin + '–' + H.lkMaks) + '</b><span>laki-laki per posko</span></div>';
    html += '<section class="tiga" aria-label="Ringkasan hasil">' + kotakBahasa + kotakProdi + '</section>' +
      '<p class="kecil">Benih acak ' + H.benih + '. Benih yang sama menghasilkan penempatan yang sama, sehingga hasil ini dapat diperiksa ulang.</p>' +
      '<section class="posko" aria-label="Hasil penempatan">' + H.unit.map(function (p) {
        var wilayah = p.bahasa
          ? '<span class="lencana ' + (p.cukup === false ? 'l-salah' : 'l-ok') + '">Wilayah ' + NAMA_BAHASA[p.bahasa] + ' · ' + p.aktif + ' aktif, ' + p.pasif + ' pasif' + (perKab && p.butuh ? ' · butuh ' + p.butuh : '') + '</span>'
          : '';
        var anggota = '<ul>' + p.anggota.map(function (m) {
          var g = !perKab && p.hitProdi[m.kp] > 1, t = tingkatBahasa(m, p.bahasa);
          var bahasa = t > 0 ? ' · ' + (p.bahasa === 'keduanya' ? 'bahasa daerah' : NAMA_BAHASA[p.bahasa]) + ' ' + TINGKAT[t].toLowerCase() : '';
          return '<li' + (g ? ' class="ganda"' : '') + '><span>' + esc(m.nama) + '<small>' + esc(m.prodi) + bahasa + (g ? ' · prodi ganda' : '') + '</small></span><b>' + m.jk + '</b></li>';
        }).join('') + '</ul>';
        return '<div class="kartu"><div><h3>' + esc(p.nama) + '</h3><p class="sub">' + p.anggota.length + ' peserta (' + p.L + ' L, ' + (p.anggota.length - p.L) + ' P)' + (perKab ? ' · ' + p.jumlahProdi + ' prodi' : '') + '</p></div>' + wilayah +
          (perKab ? '<details class="daftar"><summary>Lihat daftar peserta</summary>' + anggota + '</details>' : anggota) + '</div>';
      }).join('') + '</section>';
    return html;
  }

  // ------------------------------------------------------------------ Riwayat
  function riwayat() {
    var baris = S.riwayat.map(function (r) {
      var aksi = '';
      if (S.tanyaBatal === r.id) {
        aksi = '<button type="button" class="tombol bahaya rapat" data-a="batal-ya:' + r.id + '">Ya, batalkan</button><button type="button" class="tombol rapat" data-a="batal-tidak">Tidak</button>';
      } else if (r.status === 'Berhasil') {
        aksi = '<button type="button" class="tombol rapat" data-a="batal-minta:' + r.id + '">Batalkan impor</button>';
      }
      return '<div role="row"><span role="cell">' + r.waktu + '</span><span role="cell" class="tebal">' + r.jenis + '</span><span role="cell" style="overflow-wrap:anywhere">' + esc(r.berkas) + '</span>' +
        '<span role="cell" style="font-size:12px;color:var(--teks-2)">' + r.baru + ' baru, ' + r.ubah + ' diperbarui, ' + r.lewat + ' dilewati</span><span role="cell">' + r.oleh + '</span>' +
        '<span role="cell"><span class="lencana ' + (r.status === 'Berhasil' ? 'l-ok' : 'l-batal') + '">' + r.status + '</span></span><span role="cell" class="aksi">' + aksi + '</span></div>';
    }).join('');
    return '<header class="kepala"><div><h1>Riwayat impor</h1><p>Catatan setiap impor: siapa, kapan, berkas apa, dan berapa baris. Impor yang keliru dapat dibatalkan.</p></div></header>' +
      '<section class="kartu"><div class="gulir"><div class="tabel t-riwayat" role="table" aria-label="Riwayat impor"><div role="row" class="judul">' +
      ['Waktu', 'Jenis data', 'Berkas', 'Hasil', 'Oleh', 'Status', 'Tindakan'].map(function (k) { return '<span role="columnheader">' + k + '</span>'; }).join('') + '</div>' + baris + '</div></div></section>';
  }

  // ------------------------------------------------------------------- render
  var utama = document.getElementById('utama');
  var menu = document.getElementById('menu');
  var IKON_MENU = {
    ringkasan: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    impor: '<path d="M12 15V4M8 8l4-4 4 4M4 15v5h16v-5"/>',
    penempatan: '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    riwayat: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };

  function render(fokusKe) {
    var aktif = document.activeElement;
    var kunci = fokusKe || (aktif && (aktif.getAttribute('data-a') || aktif.id)) || '';
    menu.innerHTML = [['ringkasan', 'Ringkasan'], ['impor', 'Impor data'], ['penempatan', 'Penempatan'], ['riwayat', 'Riwayat impor']].map(function (n) {
      return '<button type="button" data-a="layar:' + n[0] + '" title="' + n[1] + '" aria-label="' + n[1] + '"' + (S.layar === n[0] ? ' aria-current="page"' : '') + '>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + IKON_MENU[n[0]] + '</svg><span>' + n[1] + '</span></button>';
    }).join('');
    utama.innerHTML = S.layar === 'ringkasan' ? ringkasan() : (S.layar === 'impor' ? impor() : (S.layar === 'penempatan' ? penempatan() : riwayat()));
    if (kunci) {
      var el = document.querySelector('[data-a="' + kunci + '"]') || document.getElementById(kunci);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
  }
  function atur(perubahan, fokusKe) {
    for (var k in perubahan) S[k] = perubahan[k];
    render(fokusKe);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    var bagian = t.getAttribute('data-a').split(':');
    var a = bagian[0], v = bagian[1];
    if (a === 'layar') atur({ layar: v, tanyaBatal: null });
    else if (a === 'rentang') atur({ rentang: v });
    else if (a === 'kelompok') atur({ kelompok: v });
    else if (a === 'tindak') atur({ tindak: v });
    else if (a === 'jenis') atur({ jenis: v, berkas: null, berkasData: null, galatBerkas: '', saring: 'semua', lewati: false });
    else if (a === 'contoh') atur({ berkas: IMPOR[S.jenis].contoh, berkasData: null, galatBerkas: '' });
    else if (a === 'saring') atur({ saring: v });
    else if (a === 'langkah') { atur({ langkah: Number(v), saring: 'semua' }); utama.focus({ preventScroll: true }); }
    else if (a === 'impor') {
      var h = hitungImpor(barisImpor());
      var J = IMPOR[S.jenis];
      var id = S.riwayat.reduce(function (m, r) { return Math.max(m, r.id); }, 0) + 1;
      var asli = !!S.berkasData;
      if (asli && S.jenis !== 'peserta') {
        var sah = S.berkasData.filter(function (r) { return r.obj; }).map(function (r) { return r.obj; });
        if (sah.length) S.dimuat[S.jenis] = sah;
      }
      var dimuat = asli && S.jenis === 'peserta' ? S.berkasData.filter(function (r) { return r.peserta; }).map(function (r) { return r.peserta; }) : [];
      if (dimuat.length) {
        S.pesertaAktif = dimuat;
        S.sumberPeserta = S.berkas;
        S.penempatan = null; S.penempatanTersimpan = false;
        S.nPosko = Math.max(1, Math.min(S.nPosko, S.pesertaAktif.length));
        S.nBugis = Math.min(S.nBugis, S.nPosko); S.nMakassar = Math.min(S.nMakassar, S.nPosko - S.nBugis);
      }
      atur({
        langkah: 4,
        riwayat: [{ id: id, waktu: 'Baru saja', jenis: J.nama, berkas: S.berkas, baru: h.baru, ubah: h.ubah, lewat: h.salah, oleh: 'admin.contoh', status: 'Berhasil' }].concat(S.riwayat),
        hasil: asli
          ? h.baru + ' ' + (S.jenis === 'peserta' ? 'peserta' : 'baris ' + J.nama.toLowerCase()) + ' dimuat dari berkas ' + S.berkas + ' dan ' + h.salah + ' baris dilewati. Data ini hanya ada di peramban ini dan hilang bila halaman dimuat ulang.'
          : h.baru + ' baris ' + J.nama.toLowerCase() + ' ditambahkan, ' + h.ubah + ' diperbarui, dan ' + h.salah + ' dilewati dari berkas ' + S.berkas + '.'
      }, 'riwayat-buka');
    }
    else if (a === 'riwayat-buka') atur({ layar: 'riwayat', langkah: 1, berkas: null, berkasData: null, lewati: false, saring: 'semua' }, 'layar:riwayat');
    else if (a === 'impor-lagi') { atur({ langkah: 1, berkas: null, berkasData: null, lewati: false, saring: 'semua' }); utama.focus({ preventScroll: true }); }
    else if (a === 'acak') {
      var susunan = susunSatuan();
      if (susunan.satuan.length) atur({ penempatan: tempatkan(dataPeserta(), susunan.satuan, S.aturan, Math.floor(Math.random() * 900000) + 100000, susunan.opsi), penempatanTersimpan: false });
    }
    else if (a === 'satuan') atur({ satuan: v, penempatan: null, penempatanTersimpan: false });
    else if (a === 'kab-tambah') { S.kab.push({ nama: '', bahasa: '', bobot: 100 }); atur({ penempatan: null, penempatanTersimpan: false }, 'kab-nama-' + (S.kab.length - 1)); }
    else if (a === 'kab-hapus') { S.kab.splice(Number(v), 1); atur({ penempatan: null, penempatanTersimpan: false }, 'kab-tambah'); }
    else if (a === 'kab-78') atur({ kab: kabupatenBawaan(), penempatan: null, penempatanTersimpan: false });
    else if (a === 'kec-78') atur({ kab: kecamatanBawaan(), penempatan: null, penempatanTersimpan: false });
    else if (a === 'unduh-sql' && S.penempatan && angkatanSah()) {
      var baris = [];
      S.penempatan.unit.forEach(function (p) { p.anggota.forEach(function (m) { baris.push({ m: m, penempatan: p.nama }); }); });
      unduhTeks('impor-peserta-angkatan-' + angkatanSah() + '-benih-' + S.penempatan.benih + '.sql',
        buatSql(baris, angkatanSah(), 'Penempatan dengan benih acak ' + S.penempatan.benih + '.'), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-angkatan' && S.dimuat.angkatan) {
      unduhTeks('impor-angkatan.sql', buatSqlAngkatan(S.dimuat.angkatan), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-lokasi' && S.dimuat.lokasi && angkatanSah()) {
      unduhTeks('impor-lokasi-angkatan-' + angkatanSah() + '.sql', buatSqlLokasi(S.dimuat.lokasi, angkatanSah()), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-pembimbing' && S.dimuat.pembimbing) {
      unduhTeks('impor-pembimbing.sql', buatSqlPembimbing(S.dimuat.pembimbing), 'application/sql;charset=utf-8');
    }
    else if (a === 'unduh-sql-peserta' && S.pesertaAktif && angkatanSah()) {
      unduhTeks('impor-peserta-angkatan-' + angkatanSah() + '-tanpa-penempatan.sql',
        buatSql(S.pesertaAktif.map(function (m) { return { m: m, penempatan: '' }; }), angkatanSah(), 'Tanpa penempatan.'), 'application/sql;charset=utf-8');
    }
    else if (a === 'simpan-penempatan') atur({ penempatanTersimpan: true }, 'unduh-penempatan');
    else if (a === 'unduh-penempatan') { if (S.penempatan) unduhCsv(S.penempatan); }
    else if (a === 'batal-minta') atur({ tanyaBatal: Number(v) }, 'batal-tidak');
    else if (a === 'batal-tidak') atur({ tanyaBatal: null });
    else if (a === 'batal-ya') {
      atur({
        tanyaBatal: null,
        riwayat: S.riwayat.map(function (r) { return r.id === Number(v) ? Object.assign({}, r, { status: 'Dibatalkan' }) : r; })
      });
      utama.focus({ preventScroll: true });
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'angkatan') atur({ angkatan: t.value });
    else if (t.id === 'lewati') atur({ lewati: t.checked });
    else if (/^kab-(nama|bahasa|bobot)-\d+$/.test(t.id)) {
      var bagian = t.id.split('-'), baris = S.kab[Number(bagian[2])];
      if (!baris) return;
      if (bagian[1] === 'bobot') { var b = Math.round(Number(t.value)); baris.bobot = isNaN(b) ? 1 : Math.max(1, Math.min(100000, b)); }
      else if (bagian[1] === 'nama') baris.nama = t.value.replace(/\s+/g, ' ').trim();
      else baris.bahasa = t.value;
      atur({ penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'angkatan-sql') atur({ angkatanSql: t.value.trim() }, t.closest('.baris').querySelector('[data-a]').getAttribute('data-a'));
    else if (t.id === 'isiposko') {
      var isi = Math.round(Number(t.value));
      atur({ isiPosko: isNaN(isi) ? 10 : Math.max(2, Math.min(100, isi)), penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'nposko' || t.id === 'nbugis' || t.id === 'nmakassar') {
      var bulat = function (v, min, maks) { v = Math.round(Number(v)); return isNaN(v) ? min : Math.max(min, Math.min(maks, v)); };
      var np = t.id === 'nposko' ? bulat(t.value, 1, Math.min(500, dataPeserta().length)) : S.nPosko;
      var nb = bulat(t.id === 'nbugis' ? t.value : S.nBugis, 0, np);
      var nm = bulat(t.id === 'nmakassar' ? t.value : S.nMakassar, 0, np);
      // Jumlah posko berbahasa daerah tidak boleh melebihi jumlah posko.
      if (nb + nm > np) { if (t.id === 'nmakassar') nb = np - nm; else nm = np - nb; }
      atur({ nPosko: np, nBugis: nb, nMakassar: nm, penempatan: null, penempatanTersimpan: false });
    }
    else if (/^a-(bahasa|prodi|jk|fak)$/.test(t.id)) {
      var aturan = { bahasa: S.aturan.bahasa, prodi: S.aturan.prodi, jk: S.aturan.jk, fak: S.aturan.fak };
      aturan[t.id.slice(2)] = t.checked;
      atur({ aturan: aturan, penempatan: null, penempatanTersimpan: false });
    }
    else if (t.id === 'berkas' && t.files && t.files[0]) {
      var f = t.files[0], jenis = S.jenis;
      f.arrayBuffer().then(function (buf) {
        if (/\.csv$/i.test(f.name)) return bacaCsv(new TextDecoder('utf-8').decode(buf));
        if (/\.xlsx$/i.test(f.name)) return bacaXlsx(buf, IMPOR[jenis].nama);
        throw new Error('Jenis berkas tidak didukung. Pakai .xlsx atau .csv.');
      }).then(function (tabel) {
        if (S.jenis !== jenis) return;
        atur({ berkas: f.name, berkasData: OLAH[jenis](tabel), galatBerkas: '', saring: 'semua', lewati: false }, 'langkah:2');
      }).catch(function (e) {
        atur({ berkas: null, berkasData: null, galatBerkas: 'Berkas ' + f.name + ' tidak dapat dibaca. ' + (e && e.message ? e.message : e) });
      });
    }
  });

  render();
})();
</script>
</body>
</html>
